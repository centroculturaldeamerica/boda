<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa asignada — Evelyn &amp; Adrian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --crema:#F8F3EA; --tinta:#2E2822; --coral:#DD7E63; --vino:#722F3A; --linea:rgba(46,40,34,0.18); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--tinta); color:var(--crema); font-family:'Jost', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--crema); color:var(--tinta); border-radius:20px; padding:40px 30px; text-align:center; max-width:360px; width:100%; box-shadow:0 20px 50px -20px rgba(0,0,0,0.5); }
  .eyebrow{ font-size:0.68rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--vino); }
  .mesa-numero{ font-family:'Cormorant Garamond'; font-size:4rem; color:var(--vino); line-height:1.1; margin:8px 0 20px; }
  .nombre{ font-family:'Cormorant Garamond'; font-size:1.5rem; font-style:italic; }
  .invitados{ margin-top:12px; font-size:0.85rem; opacity:0.75; line-height:1.5; }
  .cargando, .error{ font-family:'Cormorant Garamond'; font-style:italic; font-size:1.1rem; }
</style>
</head>
<body>
  <div class="card" id="card">
    <p class="cargando">Buscando invitación…</p>
  </div>

<script src="js/config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const card = document.getElementById("card");

  async function buscar() {
    if (!id) { card.innerHTML = '<p class="error">Falta el código de invitación.</p>'; return; }
    try {
      const res = await fetch(`${SCRIPT_URL}?action=lookup&id=${encodeURIComponent(id)}`);
      const data = await res.json();

      if (data.encontrado && data.confirmado) {
        card.innerHTML = `
          <p class="eyebrow">Mesa asignada</p>
          <p class="mesa-numero">${data.mesa || "—"}</p>
          <p class="nombre">${id}</p>
          <p class="invitados">Invitados: ${data.invitados || "—"}</p>
        `;
      } else if (data.encontrado) {
        card.innerHTML = '<p class="error">Esta invitación aún no ha confirmado asistencia.</p>';
      } else {
        card.innerHTML = '<p class="error">No se encontró esta invitación.</p>';
      }
    } catch (err) {
      card.innerHTML = '<p class="error">Error de conexión. Intenta de nuevo.</p>';
    }
  }
  buscar();
</script>
</body>
</html>
